name: Deploy bot (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - "apps/bot/**"
      - ".github/workflows/bot.yml"
  workflow_dispatch:

# Don't let two deploys race.
concurrency: deploy-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Builds the image on Fly's remote builders (no Docker needed here) and
      # rolls the always-on machine. App config + Dockerfile live in apps/bot.
      - run: flyctl deploy --remote-only --config fly.toml
        working-directory: apps/bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
